server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # DNS interno do Docker: o endereço da API é resolvido a cada requisição,
  # então o nginx sobe mesmo que a API ainda esteja iniciando.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8080;

  # Mesma origem para o navegador (sem CORS): /api/* segue para a API .NET.
  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Arquivos gerados pelo Vite têm hash no nome: podem ficar em cache por muito tempo.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA: qualquer outra rota entrega o index.html (sempre revalidado).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
