name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - name: Restaurar dependências e ferramentas
        run: |
          dotnet restore CarrinhoCompras.slnx
          dotnet tool restore

      - name: Compilar (warnings são erros)
        run: dotnet build CarrinhoCompras.slnx --configuration Release --no-restore

      - name: Garantir que não há mudanças de modelo sem migration
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/CarrinhoCompras.Infrastructure
          --startup-project src/CarrinhoCompras.Api
          --configuration Release --no-build

      - name: Testes de domínio, arquitetura e integração (PostgreSQL via Testcontainers)
        run: dotnet test --solution CarrinhoCompras.slnx --configuration Release --no-build

  frontend:
    name: Front-end (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  docker:
    name: Docker Compose (ponta a ponta)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Construir as imagens e subir a stack
        run: docker compose up --build --detach

      - name: Aguardar a API e o front
        run: |
          curl --silent --fail --retry 40 --retry-connrefused --retry-all-errors --retry-delay 2 http://localhost:5080/health
          curl --silent --fail --retry 20 --retry-connrefused --retry-all-errors --retry-delay 2 --output /dev/null http://localhost:3000/api/produtos

      - name: Rodar a coleção do Postman contra a stack
        run: npx --yes newman@6 run http/carrinho-compras.postman_collection.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar o Playwright
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium

      - name: Testes da interface ponta a ponta (Playwright)
        working-directory: e2e
        run: npx playwright test

      - name: Relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Logs dos containers em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derrubar a stack
        if: always()
        run: docker compose down --volumes
