name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - name: Restaurar dependências e ferramentas
        run: |
          dotnet restore CarrinhoCompras.slnx
          dotnet tool restore

      - name: Compilar (warnings são erros)
        run: dotnet build CarrinhoCompras.slnx --configuration Release --no-restore

      - name: Garantir que não há mudanças de modelo sem migration
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/CarrinhoCompras.Infrastructure
          --startup-project src/CarrinhoCompras.Api
          --configuration Release --no-build

      - name: Testes de domínio, arquitetura e integração (PostgreSQL via Testcontainers)
        run: dotnet test --solution CarrinhoCompras.slnx --configuration Release --no-build

  frontend:
    name: Front-end (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build das imagens do docker compose
        run: docker compose build
